name: Test and release Side A
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: side-a-release
  cancel-in-progress: false
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest httpx
      - run: python -m pytest -q
  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pyinstaller
      - name: Install official CPU worker for portable package
        run: python -c "from setup_components import install_component; J=type('J',(),{'update':lambda self,**kw:None}); install_component('engine',J())"
      - run: python -m PyInstaller --noconfirm SideA.spec
      - name: Generate license notice
        run: python scripts/collect_licenses.py
      - run: python scripts/package_release.py
      - name: Smoke-test the portable executable
        shell: pwsh
        run: |
          $env:SIDEA_HOME = Join-Path $env:RUNNER_TEMP 'side-a-smoke'
          $env:SIDEA_PORT = '8098'
          $env:SIDEA_NO_BROWSER = '1'
          $process = Start-Process -FilePath './dist/SideA/SideA.exe' -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 90; $i++) {
              try { $health = Invoke-RestMethod 'http://127.0.0.1:8098/api/health'; $ready = $health.ok; break } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'Portable app did not start' }
          } finally { Stop-Process -Id $process.Id -ErrorAction SilentlyContinue }
      - uses: actions/upload-artifact@v4
        with:
          name: side-a-downloads
          path: releases/*
      - name: Publish downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view v1.0.0 >/dev/null 2>&1 || gh release create v1.0.0 --target "$GITHUB_SHA" --title "Side A 1.0.0" --notes-file CHANGELOG.md
          gh release upload v1.0.0 releases/SideA-1.0.0-windows-x64.zip releases/SideA-1.0.0-source.zip releases/SHA256SUMS.txt --clobber
